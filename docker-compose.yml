name: proyecto-final
x-app: &app
  image: ai4i-pset4:local
  build: .
  env_file:
    - .env
  environment:
    PSET4_BACKEND: ${PSET4_BACKEND:-snowflake}
    MLFLOW_TRACKING_URI: ${MLFLOW_TRACKING_URI:-http://mlflow:5000}
    FORCE_FALLBACK: ${FORCE_FALLBACK:-0}
  volumes:
    - ./artifacts:/app/artifacts
    - ./docs:/app/docs
    - "${SNOWFLAKE_SECRETS_DIR:-./secrets}:/run/secrets:ro"
services:
  api:
    <<: *app
    # Imagen publicada por cd.yml en cada merge a main. API_IMAGE fija un commit
    # (ghcr.io/...:<sha>) o, con ai4i-pset4:local, usa la imagen construida en local.
    image: ${API_IMAGE:-ghcr.io/feliperon/proyecto-final-data-science:latest}
    depends_on:
      mlflow:
        condition: service_healthy
    ports: ["127.0.0.1:8004:8000"]
  tablero:
    <<: *app
    command: streamlit run monitoreo/tablero.py --server.address 0.0.0.0 --server.port 8501
    ports: ["127.0.0.1:8504:8501"]
  runner:
    <<: *app
    profiles: [tools]
    command: python -m monitoreo.replay
  mlflow:
    image: ai4i-pset4:local
    build: .
    command: mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri sqlite:////app/artifacts/mlflow.db --serve-artifacts --artifacts-destination /app/artifacts/mlruns
    ports: ["127.0.0.1:5003:5000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 24
    volumes:
      - ./artifacts:/app/artifacts
  spark:
    image: ai4i-runner:1
    build:
      context: .
      dockerfile: Dockerfile.ingesta
    profiles: [tools]
    env_file: .env
    volumes:
      - ./artifacts:/app/artifacts
      - "${SNOWFLAKE_SECRETS_DIR:-./secrets}:/run/secrets:ro"
    command: >-
      spark-submit --master local[2]
      --packages net.snowflake:spark-snowflake_2.12:3.1.3,net.snowflake:snowflake-jdbc:3.24.2
      spark/build_obt.py
  postgres:
    image: postgres:16.10
    environment:
      POSTGRES_DB: kestra
      POSTGRES_USER: kestra
      POSTGRES_PASSWORD: ${KESTRA_DB_PASSWORD:?Set KESTRA_DB_PASSWORD}
    volumes: [kestra-db:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U kestra]
      interval: 5s
      retries: 20
  kestra:
    image: kestra/kestra:v1.3.44
    user: root
    command: server standalone
    ports: ["127.0.0.1:8080:8080"]
    env_file: .env
    environment:
      ENV_HOST_PROJECT_DIR: ${HOST_PROJECT_DIR:-.}
      ENV_PSET4_PROJECT_DIR: ${HOST_PROJECT_DIR:-.}
      ENV_PSET4_SECRETS_DIR: ${KESTRA_SECRETS_DIR:-./secrets}
      ENV_PSET4_RUNNER_IMAGE: ${KESTRA_RUNNER_IMAGE:-ai4i-pset4:local}
      ENV_PSET4_TRACKING_URI: ${KESTRA_MLFLOW_URI:-http://host.docker.internal:5003}
      ENV_PSET4_API_URI: ${KESTRA_PREDICTION_URI:-http://host.docker.internal:8004}
      KESTRA_CONFIGURATION: |
        datasources:
          postgres:
            url: jdbc:postgresql://postgres:5432/kestra
            driverClassName: org.postgresql.Driver
            username: kestra
            password: ${KESTRA_DB_PASSWORD}
        kestra:
          server:
            basic-auth:
              username: ${KESTRA_USER}
              password: ${KESTRA_PASSWORD}
          repository:
            type: postgres
          queue:
            type: postgres
          storage:
            type: local
            local:
              base-path: /app/storage
          tasks:
            tmp-dir:
              path: /tmp/kestra-wd/tmp
          plugins:
            configurations:
              - type: io.kestra.plugin.scripts.runner.docker.Docker
                values:
                  volume-enabled: true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /tmp/kestra-wd:/tmp/kestra-wd
      - kestra-storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  kestra-db:
  kestra-storage:
