id: ai4i_pipeline
namespace: pset2
inputs:
  - id: historical_snapshot
    type: STRING
    required: false
    description: Optional snapshot path inside the runner; empty tries UCI twice before using the local CSV.
concurrency:
  limit: 1
  behavior: QUEUE
tasks:
  - id: pipeline
    type: io.kestra.plugin.scripts.shell.Commands
    containerImage: ai4i-runner:1
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
      pullPolicy: NEVER
      volumes:
        - "{{ envs.host_project_dir }}/artifacts:/app/artifacts"
        - "{{ envs.host_project_dir }}/secrets:/run/secrets:ro"
        - "{{ envs.host_project_dir }}/.env:/app/runtime.env:ro"
    env:
      SNAPSHOT_INPUT: "{{ inputs.historical_snapshot ?? '' }}"
    commands:
      - set -eu
      - set -a; . /app/runtime.env; set +a
      - export SOURCE_CSV="$SNAPSHOT_INPUT"
      - export SOURCE_CSV_FALLBACK=/app/artifacts/ai4i2020.csv
      - 'if [ ! -r "$SOURCE_CSV_FALLBACK" ] && [ -r /app/snapshots/ai4i2020.csv ]; then export SOURCE_CSV_FALLBACK=/app/snapshots/ai4i2020.csv; fi'
      - python /app/kestra/scripts/ingest.py
      - cd /app/dbt && dbt build --profiles-dir /app/dbt
      - cd /app && spark-submit --master 'local[2]' --packages net.snowflake:spark-snowflake_2.12:3.1.3,net.snowflake:snowflake-jdbc:3.24.2 spark/build_obt.py
    timeout: PT30M
    retry:
      type: exponential
      interval: PT10S
      maxInterval: PT2M
      maxAttempts: 3
errors:
  - id: failure
    type: io.kestra.plugin.core.log.Log
    level: ERROR
    message: "Falló {{ execution.id }}; revisar RAW, dbt y logs Spark. No publicar resultados de esta ejecución."
triggers:
  - id: weekly_snapshot_check
    disabled: false
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 6 * * 1"
    timezone: America/Guayaquil
