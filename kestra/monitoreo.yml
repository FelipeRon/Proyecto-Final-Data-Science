id: monitoreo
namespace: pset4
tasks:
  - id: alertas
    type: io.kestra.plugin.scripts.shell.Commands
    containerImage: "{{ envs.pset4_runner_image }}"
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
      pullPolicy: NEVER
      volumes:
        - "{{ envs.pset4_project_dir }}:/app"
    commands:
      - >-
        python -c 'import json, urllib.request;
        print(json.load(urllib.request.urlopen("{{ envs.pset4_api_uri }}/monitoreo", timeout=30)))'
