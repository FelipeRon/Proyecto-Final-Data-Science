id: monitoreo
namespace: pset4
tasks:
  - id: alertas
    type: io.kestra.plugin.scripts.shell.Commands
    containerImage: ai4i-pset4:local
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
      pullPolicy: NEVER
      volumes:
        - "{{ envs.pset4_project_dir }}:/app"
    commands:
      - >-
        python -c 'import json, urllib.request;
        print(json.load(urllib.request.urlopen("http://host.docker.internal:8004/monitoreo", timeout=30)))'
