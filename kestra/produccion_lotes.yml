id: produccion_lotes
namespace: pset4
tasks:
  - id: replay
    type: io.kestra.plugin.scripts.shell.Commands
    containerImage: ai4i-pset4:local
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
      pullPolicy: NEVER
      volumes:
        - "{{ envs.pset4_project_dir }}:/app"
        - "{{ envs.pset4_secrets_dir }}:/run/secrets:ro"
    env:
      PSET4_BACKEND: snowflake
      MLFLOW_TRACKING_URI: http://host.docker.internal:5003
    commands:
      - set -a; . /app/.env; set +a
      - export PSET4_BACKEND=snowflake
      - python -m monitoreo.replay
  - id: monitoreo
    type: io.kestra.plugin.core.flow.Subflow
    namespace: pset4
    flowId: monitoreo
    wait: true
    transmitFailed: true
