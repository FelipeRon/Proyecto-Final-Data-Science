version: 2
models:
  - name: stg_readings
    columns:
      - name: file_sha256
        tests: [not_null]
  - name: int_readings
    columns:
      - name: reading_id
        tests: [not_null, unique]
      - name: machine_failure
        tests:
          - not_null
          - accepted_values:
              values: [0, 1]
              quote: false
  - name: dim_product_type
    columns:
      - name: product_type
        tests: [not_null, unique]
  - name: fct_reading
    columns:
      - name: reading_id
        tests: [not_null, unique]
      - name: product_type
        tests:
          - not_null
          - relationships:
              to: ref('dim_product_type')
              field: product_type
